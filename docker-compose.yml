services:
  nostr-city:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_DEMO_MODE: ${VITE_PUBLIC_DEMO_MODE:-false}
    image: nostr-city:local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BFF_CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      FASTIFY_TRUST_PROXY: "false"
      NOSTR_CITY_DOCKER_LOCAL: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
